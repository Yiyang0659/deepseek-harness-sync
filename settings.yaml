        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
          contextWindow: 1000000
          maxTokens: 131072
        - id: glm-5.3
          name: GLM-5.3
          contextWindow: 1000000
          maxTokens: 131072
        - id: glm-5.3-flash
          name: GLM-5.3-Flash
          contextWindow: 1000000
          maxTokens: 131072
        - id: gpt-5.6-luna
          name: GPT-5.6 Luna
          contextWindow: 1050000
          maxTokens: 128000
